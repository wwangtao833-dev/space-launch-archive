name: Deploy archive to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and data
        run: |
          node --check app.js
          python scripts/validate_archive.py
          node -e "const d=require('./data/launches.json');if(!Array.isArray(d)||new Set(d.map(x=>x.id)).size!==d.length)process.exit(1)"
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css .nojekyll _site/
          cp data/*.json _site/data/
          if [ -d archive ]; then cp -r archive _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
